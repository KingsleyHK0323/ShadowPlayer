# Authored by: OpenAI-Codex
name: Deploy website on source updates

on:
  push:
    branches:
      - Source_Code
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  package:
    name: Package the Website branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site_ready: ${{ steps.site.outputs.ready }}
    steps:
      - name: Check whether the Website branch exists
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/Website")"
          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Website branch is unavailable; deployment is skipped."
              ;;
            *)
              echo "::error::Unable to inspect the Website branch (HTTP $status)."
              exit 1
              ;;
          esac

      - name: Check out Website
        if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: Website
          persist-credentials: false

      - name: Inspect static website
        if: steps.branch.outputs.exists == 'true'
        id: site
        shell: bash
        run: |
          set -euo pipefail
          if [[ -L index.html ]]; then
            echo "::error::The website entry point must not be a symbolic link."
            exit 1
          elif [[ ! -f index.html ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root index.html exists; deployment is skipped."
          else
            if find . -path './.git' -prune -o -type l -print -quit | grep -q .; then
              echo "::error::The website contains a symbolic link."
              exit 1
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.site.outputs.ready == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website artifact
        if: steps.site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: package
    if: needs.package.outputs.site_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: shadowplayer-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
